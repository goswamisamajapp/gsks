<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>गोस्वामी समाज कल्याण समिति - GSKS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Rozha+One&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    .hindi-title {
      font-family: 'Yatra One', cursive;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-orange-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-gray-800">
  
  <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-10 border border-orange-200 text-center relative overflow-hidden">
    
    <!-- Top Accent Bar -->
    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-orange-500 via-amber-500 to-red-500"></div>

    <!-- Badge -->
    <div class="inline-flex items-center gap-2 bg-orange-100 border border-orange-300 text-orange-700 font-bold px-5 py-1.5 rounded-full text-sm mb-6 shadow-sm">
      <span>🚩</span>
      <span>ॐ नमः शिवाय</span>
    </div>

    <!-- Official Logo -->
    <div class="flex justify-center mb-6">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-orange-600 to-amber-500 rounded-full blur opacity-40 group-hover:opacity-75 transition duration-300"></div>
        <img 
          src="/logo.png" 
          alt="गोस्वामी समाज कल्याण समिति लोगो" 
          class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-full object-cover shadow-xl border-4 border-white"
        />
      </div>
    </div>

    <!-- Main Title (Hindi) -->
    <h1 class="text-2xl sm:text-4xl font-extrabold text-orange-800 hindi-title tracking-wide mb-2 leading-tight">
      गोस्वामी समाज कल्याण समिति
    </h1>
    
    <h2 class="text-sm sm:text-base font-semibold text-gray-600 mb-2 tracking-wide uppercase">
      Goswami Samaj Kalyan Samiti (GSKS)
    </h2>

    <!-- Address -->
    <div class="inline-flex items-center justify-center gap-1.5 text-orange-950 font-medium bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 text-sm mb-8 shadow-sm">
      <svg class="w-4 h-4 text-orange-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
      </svg>
      <span>गुनघसा, गोमो, धनबाद - 828401 (झारखंड)</span>
    </div>

    <!-- System Status Badges -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6 text-left">
      <div class="p-3.5 bg-green-50 border border-green-200 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-green-600 font-semibold uppercase tracking-wider">GitHub</p>
          <p class="text-xs font-bold text-green-900 mt-0.5">Connected</p>
        </div>
        <span class="text-base">✅</span>
      </div>
      <div class="p-3.5 bg-blue-50 border border-blue-200 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-blue-600 font-semibold uppercase tracking-wider">Render</p>
          <p class="text-xs font-bold text-blue-900 mt-0.5">Live Online</p>
        </div>
        <span class="text-base">🚀</span>
      </div>
      <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-amber-600 font-semibold uppercase tracking-wider">Firebase</p>
          <p class="text-xs font-bold text-amber-900 mt-0.5">Configured</p>
        </div>
        <span class="text-base">🔥</span>
      </div>
    </div>

    <!-- Footer Email Identity -->
    <div class="border-t border-gray-100 pt-4 text-xs text-gray-500">
      Official Email: <span class="font-mono text-orange-800 font-semibold">goswamisamajtrust@gmail.com</span>
    </div>

  </div>

</body>
</html>
